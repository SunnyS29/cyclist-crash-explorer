<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melbourne Cyclist Crash Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --amber:#ffb000; --bg:#0d0d0f; --panel:#161618; --line:#262629; --text:#e8e6e3; --dim:#8a8a8a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { padding:24px 20px 16px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:22px; color:var(--amber); }
    .sub { color:var(--dim); font-size:13px; margin-top:4px; }
    main { max-width:880px; margin:0 auto; padding:20px; }

    .search { display:flex; gap:8px; margin-bottom:16px; }
    .search input { flex:1; padding:12px 14px; font-size:15px; border-radius:8px;
                    border:1px solid var(--line); background:var(--panel); color:var(--text); }
    .search button, .cards button { cursor:pointer; }
    .search button { padding:0 18px; border-radius:8px; border:none;
                     background:var(--amber); color:#1a1300; font-weight:600; }

    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
             gap:8px; margin-bottom:16px; }
    .cards button { padding:12px; border-radius:8px; border:1px solid var(--line);
                    background:var(--panel); color:var(--text); text-align:left; font-size:13px; }
    .cards button:hover { border-color:var(--amber); }

    .filter { display:flex; align-items:center; gap:12px; margin-bottom:16px;
              padding:12px; background:var(--panel); border-radius:8px; font-size:13px; }
    .filter input[type=range] { flex:1; accent-color:var(--amber); }
    #year-label { color:var(--amber); font-weight:600; min-width:80px; text-align:right; }

    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
    #result-title { margin:0 0 4px; font-size:16px; }
    #result-caption { color:var(--dim); font-size:13px; margin:0 0 14px; }
    .chart-box { position:relative; height:340px; }
    #stat { display:none; font-size:56px; font-weight:700; color:var(--amber); text-align:center; padding:40px 0; }
    #status { color:var(--dim); font-size:13px; min-height:18px; margin-top:8px; }

    #toggle-data { background:none; border:none; color:var(--amber); cursor:pointer;
                   font-size:13px; padding:10px 0 0; }
    #table-wrap { display:none; margin-top:10px; max-height:320px; overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--dim); position:sticky; top:0; background:var(--panel); }

    #loading { text-align:center; padding:80px 20px; color:var(--dim); }
    footer { text-align:center; color:var(--dim); font-size:12px; padding:24px; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>Melbourne Cyclist Crash Explorer</h1>
    <div class="sub">13 years · 16,056 crashes · VicRoads data 2012–2025</div>
  </header>

  <main>
    <div id="loading">Loading data engine (~6 MB)… first load may take a moment.</div>

    <div id="app" style="display:none">
      <div class="search">
        <input id="search" placeholder="Ask a question or type a council… e.g. &quot;worst suburbs&quot;, &quot;Yarra&quot;, &quot;fatal crashes 2023&quot;" />
        <button id="search-btn">Search</button>
      </div>

      <div class="cards">
        <button data-card="worstCouncils">Which council has the most crashes?</button>
        <button data-card="yearlyTrend">Is it getting safer over time?</button>
        <button data-card="byHour">When do most crashes happen?</button>
        <button data-card="bySeverity">How serious are crashes?</button>
        <button data-card="fatalCount">How many were fatal?</button>
        <button data-card="byRoadGeometry">Most dangerous road types?</button>
      </div>

      <div class="filter">
        <span>Year range</span>
        <input id="year-min" type="range" min="2012" max="2025" value="2012" />
        <input id="year-max" type="range" min="2012" max="2025" value="2025" />
        <span id="year-label">2012–2025</span>
      </div>

      <div class="panel">
        <h2 id="result-title">Results</h2>
        <p id="result-caption"></p>
        <div class="chart-box">
          <canvas id="chart"></canvas>
          <div id="stat"></div>
        </div>
        <div id="status"></div>
        <button id="toggle-data">Show raw data ▾</button>
        <div id="table-wrap"></div>
      </div>
    </div>
  </main>

  <footer>
    Data: VicRoads cyclist crash records 2012–2025 · Static dataset, not live ·
    Built with DuckDB WASM + Chart.js
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
