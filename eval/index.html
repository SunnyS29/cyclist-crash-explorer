<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intent Eval — Cyclist Crash Explorer</title>
  <style>
    body { background:#0d0d0f; color:#e8e6e3; font:14px/1.5 ui-monospace,monospace; padding:24px; }
    h1 { color:#ffb000; font-size:18px; }
    .score { font-size:28px; margin:12px 0; }
    .pass { color:#5fd35f; } .fail { color:#ff5f5f; }
    .row { padding:4px 0; border-bottom:1px solid #222; }
    .meta { color:#888; padding-left:20px; }
  </style>
</head>
<body>
  <h1>Intent Eval</h1>
  <div id="score" class="score">running…</div>
  <div id="results"></div>

  <script type="module">
    import { parseIntent } from "../js/intent.js";
    import { cases } from "./cases.js";

    const THRESHOLD = 0.9;
    const fmt = (g) => g
      ? g.builder + (g.params.council ? " / " + g.params.council : "") +
        (g.year ? " / " + JSON.stringify(g.year) : "")
      : "null";

    let pass = 0;
    const rows = [];

    for (const c of cases) {
      const got = parseIntent(c.input);
      const ok = c.expectNull
        ? got === null
        : got && got.builder === c.builder &&
          (c.council == null || got.params.council === c.council) &&
          (c.year == null ||
            (got.year && got.year.min === c.year.min && got.year.max === c.year.max));
      if (ok) pass++;
      const exp = c.expectNull ? "null" : c.builder +
        (c.council ? " / " + c.council : "") +
        (c.year ? " / " + JSON.stringify(c.year) : "");
      rows.push(`<div class="row">
        <span class="${ok ? "pass" : "fail"}">${ok ? "✓" : "✗"}</span>
        "${c.input}"
        ${ok ? "" : `<div class="meta">expected: ${exp}<br>got: ${fmt(got)}</div>`}
      </div>`);
    }

    const acc = pass / cases.length;
    const el = document.getElementById("score");
    el.textContent = `${pass}/${cases.length} (${(acc * 100).toFixed(1)}%) — ${acc >= THRESHOLD ? "PASS" : "FAIL"}`;
    el.className = "score " + (acc >= THRESHOLD ? "pass" : "fail");
    document.getElementById("results").innerHTML = rows.join("");
  </script>
</body>
</html>
