<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intent Eval — Cyclist Crash Explorer</title>
  <style>
    body { background:#0d0d0f; color:#e8e6e3; font:14px/1.5 ui-monospace,monospace; padding:24px; }
    h1 { color:#ffb000; font-size:18px; }
    .score { font-size:28px; margin:12px 0; }
    .pass { color:#5fd35f; } .fail { color:#ff5f5f; }
    .row { padding:4px 0; border-bottom:1px solid #222; }
    .meta { color:#888; padding-left:20px; }
  </style>
</head>
<body>
  <h1>Intent Eval</h1>
  <div id="score" class="score">running…</div>
  <div id="results"></div>

  <script type="module">
    import { parseIntent } from "../js/intent.js";
    import { cases } from "./cases.js";

    import { matches } from "./assertions.js";
    let pass = 0;
    const results = document.getElementById("results");
    for (const c of cases) {
      const got = parseIntent(c.input), ok = matches(c, got);
      if (ok) pass++;
      const row = document.createElement("div");
      row.className = "row " + (ok ? "pass" : "fail");
      row.textContent = `${ok ? "✓" : "✗"} ${c.input}`;
      if (!ok) {
        const details = document.createElement("pre");
        details.textContent = JSON.stringify({ expected: c, got }, null, 2);
        row.append(details);
      }
      results.append(row);
    }
    const el = document.getElementById("score");
    const ok = pass === cases.length;
    el.textContent = `${pass}/${cases.length} — ${ok ? "PASS" : "FAIL"}`;
    el.className = "score " + (ok ? "pass" : "fail");
  </script>
</body>
</html>
